<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
:root{
  --bg-0:#070707;--bg-1:#0d0d0d;--bg-2:#131313;--bg-3:#1a1a1a;--bg-4:#222;--bg-5:#2d2d2d;
  --line:#212121;--line-2:#303030;
  --text:#f6f6f6;--text-2:#cdcdcd;--text-3:#999;--text-4:#666;
  --inv:#070707;
  --shadow:0 20px 60px rgba(0,0,0,.65);
  --r-sm:8px;--r:12px;--r-lg:16px;--r-xl:22px;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --out:cubic-bezier(.16,1,.3,1);
  --smooth:cubic-bezier(.4,0,.2,1);
  --fs:1;--av-r:50%;
}
body.light{
  --bg-0:#f1f1ef;--bg-1:#fbfbfa;--bg-2:#f5f5f3;--bg-3:#ededeb;--bg-4:#e3e3e0;--bg-5:#d5d5d1;
  --line:#e2e2df;--line-2:#d1d1cd;
  --text:#111;--text-2:#353535;--text-3:#6a6a6a;--text-4:#9c9c9c;
  --inv:#fbfbfa;
  --shadow:0 20px 60px rgba(0,0,0,.16);
}
body.squircle{--av-r:34%;}
body{
  font-family:'Tajawal','Space Grotesk',-apple-system,sans-serif;
  font-size:calc(14.5px*var(--fs));display:flex;overflow:hidden;
  background:var(--bg-0);color:var(--text);-webkit-font-smoothing:antialiased;
  transition:background .45s var(--smooth),color .45s var(--smooth);
}
body.noanim *,body.noanim *::before,body.noanim *::after{animation:none!important;transition:none!important;}
body.nobg .ambient{display:none;}
button,textarea,input{font-family:inherit;color:inherit;}
button{-webkit-tap-highlight-color:transparent;}
svg{display:block;flex-shrink:0;}
svg .f{fill:currentColor;fill-opacity:.16;stroke:none;}
::selection{background:var(--text);color:var(--inv);}
:focus-visible{outline:2px solid var(--text-3);outline-offset:2px;}
.muted{color:var(--text-4);}

/* ---------- SPLASH ---------- */
.splash{position:fixed;inset:0;z-index:99999;background:var(--bg-0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .8s var(--smooth),visibility .8s,transform .8s var(--out);}
.splash.hide{opacity:0;visibility:hidden;transform:scale(1.08);}
.splash-mark{position:relative;width:120px;height:120px;display:grid;place-items:center;animation:pop 1s var(--spring) both;}
.splash-logo{width:84px;height:84px;}
.orbit{position:absolute;inset:0;color:var(--text-3);animation:spin 14s linear infinite;}
.orbit.b{inset:8px;color:var(--text-4);animation-duration:22s;animation-direction:reverse;}
@keyframes spin{to{transform:rotate(360deg);}}
@keyframes pop{from{transform:scale(.4) rotate(-14deg);opacity:0;}to{transform:none;opacity:1;}}
.draw path.k{stroke-dasharray:170;stroke-dashoffset:170;animation:draw 1.2s .4s var(--out) forwards;}
.draw .dot{transform-origin:73px 27px;animation:dotpop .6s 1.4s var(--spring) both;}
@keyframes draw{to{stroke-dashoffset:0;}}
@keyframes dotpop{from{transform:scale(0);}to{transform:scale(1);}}
.splash-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.25rem;letter-spacing:.55em;padding-inline-start:.55em;animation:rise .9s .55s var(--out) both;}
.splash-bar{width:150px;height:2px;background:var(--bg-4);overflow:hidden;border-radius:2px;animation:rise .9s .75s var(--out) both;}
.splash-bar::after{content:'';display:block;height:100%;width:40%;background:var(--text);animation:slide 1.3s var(--smooth) infinite;}
@keyframes slide{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
@keyframes rise{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}

/* ---------- AMBIENT ---------- */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;}
.ambient::before{content:'';position:absolute;inset:0;background-image:radial-gradient(var(--line-2) 1px,transparent 1px);background-size:28px 28px;opacity:.45;mask-image:radial-gradient(ellipse at 50% 40%,#000 0,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 0,transparent 75%);}
.ambient::after{content:'';position:absolute;width:560px;height:560px;border-radius:50%;left:18%;top:-12%;background:radial-gradient(circle,rgba(255,255,255,.05),transparent 65%);animation:drift 26s ease-in-out infinite;}
body.light .ambient::after{background:radial-gradient(circle,rgba(0,0,0,.05),transparent 65%);}
@keyframes drift{0%,100%{transform:translate(0,0);}50%{transform:translate(120px,90px);}}
.app{display:flex;width:100%;height:100vh;position:relative;z-index:1;}

/* ---------- RAIL ---------- */
.rail{width:76px;background:var(--bg-1);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:8px;flex-shrink:0;overflow-y:auto;overflow-x:hidden;}
.rail::-webkit-scrollbar{width:0;}
.srv{width:46px;height:46px;border-radius:15px;background:var(--bg-3);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:.95rem;color:var(--text-2);cursor:pointer;transition:background .35s var(--out),color .35s var(--out),border-radius .45s var(--out),transform .35s var(--spring),border-color .35s,box-shadow .35s,opacity .3s;position:relative;flex-shrink:0;animation:rise .6s var(--out) both;overflow:visible;}
.srv img.ico{width:100%;height:100%;object-fit:cover;border-radius:inherit;}
.srv:hover{border-radius:11px;background:var(--bg-5);color:var(--text);transform:translateY(-2px);}
.srv.active{background:var(--text);color:var(--inv);border-color:var(--text);border-radius:11px;}
.srv::before{content:'';position:absolute;right:-15px;top:50%;width:4px;height:0;background:var(--text);border-radius:4px 0 0 4px;transform:translateY(-50%);transition:height .4s var(--spring);}
.srv.active::before{height:26px;}
.srv:not(.active):hover::before{height:10px;}
.srv.home{background:transparent;border:none;}
.srv.home.active{background:transparent;}
.srv.home svg{width:44px;height:44px;transition:transform .55s var(--spring);}
.srv.home:hover svg{transform:rotate(-8deg) scale(1.08);}
.srv.sep{height:1px;width:28px;border-radius:0;background:var(--line-2);border:none;cursor:default;animation:none;}
.srv.sep:hover{transform:none;}
.srv.sep::before{display:none;}
.srv.add{border-style:dashed;color:var(--text-3);background:transparent;}
.srv.add:hover{color:var(--text);border-color:var(--text-3);}
.srv.add svg{transition:transform .45s var(--spring);}
.srv.add:hover svg{transform:rotate(90deg);}
.tip{position:fixed;z-index:100002;background:var(--text);color:var(--inv);padding:6px 12px;border-radius:8px;font-size:.78rem;font-weight:800;pointer-events:none;opacity:0;transform:translateX(6px);transition:.2s var(--out);white-space:nowrap;}
.tip.show{opacity:1;transform:none;}

/* ---------- SIDEBAR ---------- */
.sidebar{width:270px;background:var(--bg-2);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0;}
.srv-header{height:60px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);cursor:pointer;transition:background .2s;}
.srv-header:hover{background:var(--bg-3);}
.brand{display:flex;align-items:center;gap:10px;min-width:0;}
.brand-logo{width:28px;height:28px;flex-shrink:0;}
.brand-logo img{width:100%;height:100%;border-radius:9px;object-fit:cover;}
.brand-name{font-weight:800;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.srv-header .chev{color:var(--text-3);transition:transform .35s var(--spring);}
.srv-header:hover .chev{transform:translateY(2px);}
.ch-search-wrap{padding:10px 12px;position:relative;}
.ch-search-wrap>span{position:absolute;top:50%;right:25px;transform:translateY(-50%);color:var(--text-4);pointer-events:none;}
.ch-search{width:100%;background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 36px 8px 44px;font-size:.82rem;outline:none;transition:.3s var(--out);cursor:text;}
.ch-search:focus{border-color:var(--text-4);background:var(--bg-4);}
.ch-search::placeholder{color:var(--text-4);}
.kbd{position:absolute;left:22px;top:50%;transform:translateY(-50%);font-size:.62rem;color:var(--text-4);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px;font-family:'Space Grotesk',sans-serif;pointer-events:none;}
.ch-scroll{flex:1;overflow-y:auto;padding:4px 8px 10px;}
.ch-scroll::-webkit-scrollbar{width:4px;}
.ch-scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:2px;}
.cat{font-size:.68rem;font-weight:800;color:var(--text-4);padding:16px 8px 6px;display:flex;align-items:center;gap:5px;letter-spacing:.08em;cursor:pointer;user-select:none;transition:color .2s;}
.cat:hover{color:var(--text-2);}
.cat .chev{transition:transform .35s var(--out);}
.cat .cname{flex:1;}
.cat .addch{opacity:0;padding:2px;border-radius:5px;display:grid;transition:.25s var(--spring);}
.cat:hover .addch{opacity:1;}
.cat .addch:hover{background:var(--bg-5);color:var(--text);transform:rotate(90deg) scale(1.15);}
.cat-group.collapsed .cat .chev{transform:rotate(90deg);}
.cat-group.collapsed .ch,.cat-group.collapsed .voice-users{display:none;}
.ch{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--text-3);cursor:pointer;font-size:.9rem;font-weight:500;transition:all .3s var(--out);margin-bottom:2px;position:relative;animation:rise .5s var(--out) both;}
.ch:hover{background:var(--bg-4);color:var(--text);transform:translateX(-3px);}
.ch.active{background:var(--bg-5);color:var(--text);font-weight:800;}
.ch.active::before{content:'';position:absolute;inset-inline-start:-8px;top:50%;width:3px;height:18px;background:var(--text);border-radius:0 3px 3px 0;transform:translateY(-50%);animation:grow .4s var(--spring);}
@keyframes grow{from{height:0;}to{height:18px;}}
.ch svg{opacity:.75;transition:transform .35s var(--spring),opacity .2s;}
.ch:hover svg,.ch.active svg{opacity:1;}
.ch:hover svg{transform:scale(1.12) rotate(-6deg);}
.ch .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ch.in-voice{color:var(--text);}
.ch .live{width:6px;height:6px;border-radius:50%;background:var(--text);animation:blink 1.6s ease-in-out infinite;}
@keyframes blink{50%{opacity:.25;}}
.voice-users{padding:2px 0 6px;margin-inline-start:26px;}
.vu{display:flex;align-items:center;gap:8px;padding:3px 6px;font-size:.78rem;color:var(--text-3);animation:rise .45s var(--out) both;}
.vu.speaking .av{box-shadow:0 0 0 2px var(--text);}
.voice-panel{display:none;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg-3);}
.voice-panel.show{display:flex;animation:rise .45s var(--out);}
.voice-panel .info{flex:1;min-width:0;line-height:1.3;}
.voice-panel b{font-size:.78rem;display:block;}
.voice-panel small{font-size:.68rem;color:var(--text-3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bars{display:flex;align-items:flex-end;gap:2px;height:16px;}
.bars i{width:3px;background:var(--text);border-radius:2px;animation:eq 1s ease-in-out infinite;transform-origin:bottom;height:100%;}
.bars i:nth-child(2){animation-delay:.2s;}.bars i:nth-child(3){animation-delay:.4s;}.bars i:nth-child(4){animation-delay:.6s;}
@keyframes eq{0%,100%{transform:scaleY(.3);}50%{transform:scaleY(1);}}
.user-bar{height:62px;background:var(--bg-1);border-top:1px solid var(--line);padding:0 10px;display:flex;align-items:center;gap:4px;}

/* avatars */
.av{border-radius:var(--av-r);display:grid;place-items:center;font-weight:800;flex-shrink:0;position:relative;user-select:none;transition:border-radius .4s var(--out);}
.av img.pic{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block;}
.av.t0{background:var(--bg-5);color:var(--text);}
.av.t1{background:var(--text);color:var(--inv);}
.av.t2{background:var(--bg-4);color:var(--text);border:1px solid var(--line-2);}
.av.t3{background:var(--text-3);color:var(--inv);}
.me-av{width:36px;height:36px;font-size:.85rem;cursor:pointer;transition:transform .35s var(--spring),border-radius .4s var(--out);}
.me-av:hover{transform:scale(1.1);}
.st{position:absolute;bottom:-3px;left:-3px;width:15px;height:15px;border-radius:50%;background:var(--bg-1);display:grid;place-items:center;color:var(--text);}
.user-info{flex:1;min-width:0;line-height:1.3;cursor:pointer;padding:4px 6px;border-radius:8px;transition:.2s;}
.user-info:hover{background:var(--bg-3);}
.user-info b{font-size:.82rem;display:block;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-info small{font-size:.7rem;color:var(--text-4);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.icon-btn{background:none;border:none;color:var(--text-3);cursor:pointer;padding:7px;border-radius:9px;display:grid;place-items:center;transition:all .3s var(--out);position:relative;}
.icon-btn:hover{color:var(--text);background:var(--bg-4);transform:translateY(-1px);}
.icon-btn:active{transform:scale(.9);}
.icon-btn.on{color:var(--text);background:var(--bg-4);}
.icon-btn.off{color:var(--text);}
.icon-btn.off::after{content:'';position:absolute;width:20px;height:2px;background:var(--text);transform:rotate(-45deg);box-shadow:0 0 0 2px var(--bg-1);border-radius:2px;}

/* ---------- CHAT ---------- */
.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-1);position:relative;}
.chat-header{height:60px;padding:0 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-shrink:0;}
.chat-header .hash{color:var(--text-3);transition:transform .45s var(--spring);}
.chat-header:hover .hash{transform:rotate(15deg) scale(1.1);color:var(--text);}
.chat-header h2{font-size:.95rem;font-weight:800;}
.chat-header .divider{width:1px;height:18px;background:var(--line-2);margin:0 6px;}
.chat-header .topic{color:var(--text-4);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.chat-header .actions{display:flex;gap:2px;align-items:center;}
.pin-badge{display:none;align-items:center;gap:6px;background:var(--bg-3);border:1px solid var(--line-2);padding:4px 11px;border-radius:20px;font-size:.72rem;font-weight:800;cursor:pointer;transition:.3s var(--out);margin-inline-end:6px;}
.pin-badge.show{display:flex;animation:pop .55s var(--spring);}
.pin-badge:hover{background:var(--text);color:var(--inv);}
.body{flex:1;display:flex;min-height:0;}
.col{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
.messages{flex:1;overflow-y:auto;padding:14px 0 6px;scroll-behavior:smooth;}
.messages.swap{animation:swapIn .5s var(--out);}
@keyframes swapIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.messages::-webkit-scrollbar{width:8px;}
.messages::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:4px;}
.tobottom{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px) scale(.8);background:var(--text);color:var(--inv);border:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:.4s var(--spring);box-shadow:var(--shadow);z-index:5;}
.tobottom.show{opacity:1;pointer-events:auto;transform:translate(-50%,0) scale(1);}
.tobottom:hover{transform:translate(-50%,-3px) scale(1.08);}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;min-height:100%;}
.empty svg.art{width:160px;height:118px;margin-bottom:22px;color:var(--text-3);animation:floaty 4.5s ease-in-out infinite;}
@keyframes floaty{50%{transform:translateY(-8px);}}
.empty h2{font-size:1.6rem;font-weight:800;margin-bottom:8px;}
.empty p{color:var(--text-4);font-size:.9rem;max-width:380px;line-height:1.7;}
.date-sep{display:flex;align-items:center;gap:12px;padding:14px 22px 6px;color:var(--text-4);font-size:.7rem;font-weight:800;}
.date-sep::before,.date-sep::after{content:'';flex:1;height:1px;background:var(--line);}
.msg{padding:6px 22px;display:flex;gap:14px;position:relative;animation:msgIn .55s var(--out);transition:background .2s;}
body.compact .msg{padding-top:2px;padding-bottom:2px;}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.99);}to{opacity:1;transform:none;}}
.msg:hover{background:var(--bg-2);}
.msg.flash{animation:flash 1.4s ease;}
@keyframes flash{0%,100%{background:transparent;}30%{background:var(--bg-4);}}
.msg.pinned::after{content:'';position:absolute;inset-inline-start:0;top:6px;bottom:6px;width:2px;background:var(--text);border-radius:2px;}
.msg .av{width:40px;height:40px;font-size:.95rem;cursor:pointer;transition:transform .35s var(--spring),border-radius .4s var(--out);}
.msg .av:hover{transform:scale(1.08);}
.msg.grouped{padding-top:1px;padding-bottom:1px;}
.msg.grouped .av{visibility:hidden;height:0;}
.gtime{position:absolute;right:22px;width:40px;text-align:center;font-size:.62rem;color:var(--text-4);top:7px;transition:opacity .15s;display:none;opacity:0;}
.msg.grouped .gtime{display:block;}
.msg.grouped:hover .gtime{opacity:1;}
.msg-body{flex:1;min-width:0;padding-top:2px;}
.msg-head{display:flex;align-items:baseline;gap:8px;margin-bottom:3px;flex-wrap:wrap;}
.msg-head b{font-size:.92rem;font-weight:800;cursor:pointer;}
.msg-head b:hover{text-decoration:underline;}
.badge{font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:5px;background:var(--text);color:var(--inv);letter-spacing:.06em;}
.msg-head .edited{font-size:.65rem;color:var(--text-4);}
.msg-head time{color:var(--text-4);font-size:.7rem;}
.msg-text{font-size:.92rem;line-height:1.7;color:var(--text-2);word-wrap:break-word;white-space:pre-wrap;}
.msg-text a{color:var(--text);text-decoration:underline;text-underline-offset:3px;}
.msg-text code{background:var(--bg-4);padding:1px 6px;border-radius:5px;font-family:'Space Grotesk',monospace;font-size:.85em;}
.msg-text .mention{background:var(--bg-5);color:var(--text);padding:1px 6px;border-radius:5px;font-weight:800;}
.msg-reply-preview{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--text-4);margin-bottom:5px;padding:3px 10px;border-inline-start:2px solid var(--text-4);border-radius:3px;cursor:pointer;transition:.25s var(--out);width:fit-content;max-width:100%;}
.msg-reply-preview:hover{background:var(--bg-3);transform:translateX(-3px);}
.msg-reply-preview b{color:var(--text-3);}
.msg-reply-preview span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msg-like-btn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line-2);padding:3px 11px 3px 9px;border-radius:20px;font-size:.78rem;font-weight:800;color:var(--text-3);cursor:pointer;transition:all .35s var(--spring);margin-top:7px;user-select:none;}
.msg-like-btn:hover{border-color:var(--text-3);color:var(--text);transform:translateY(-1px);}
.msg-like-btn.liked{background:var(--text);border-color:var(--text);color:var(--inv);}
.msg-like-btn.liked svg{fill:currentColor;}
.msg-like-btn.pop svg{animation:heartPop .6s var(--spring);}
@keyframes heartPop{0%{transform:scale(1);}35%{transform:scale(1.6) rotate(-12deg);}65%{transform:scale(.88);}100%{transform:scale(1);}}
.float-heart{position:fixed;pointer-events:none;z-index:9999;color:var(--text);animation:fh 1.2s var(--out) forwards;}
@keyframes fh{0%{transform:translate(0,0) scale(.5);opacity:0;}20%{opacity:1;transform:translate(-4px,-14px) scale(1.1) rotate(-12deg);}100%{transform:translate(var(--dx),-100px) scale(.6) rotate(18deg);opacity:0;}}
.msg-toolbar{position:absolute;top:-16px;left:22px;display:flex;gap:1px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:12px;padding:3px;opacity:0;pointer-events:none;transition:.3s var(--out);box-shadow:var(--shadow);z-index:10;transform:translateY(6px) scale(.96);}
.msg:hover .msg-toolbar{opacity:1;pointer-events:auto;transform:none;}
.msg-toolbar button{background:none;border:none;color:var(--text-3);padding:6px 8px;border-radius:8px;cursor:pointer;display:grid;place-items:center;transition:.25s var(--spring);}
.msg-toolbar button:hover{background:var(--bg-5);color:var(--text);transform:scale(1.15);}
.msg-toolbar button.on{color:var(--text);}
.msg-attach{margin-top:8px;max-width:440px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;transition:.35s var(--out);}
.msg-attach:hover{border-color:var(--text-4);transform:translateY(-2px);}
.msg-attach .att-head{padding:8px 12px;font-size:.74rem;color:var(--text-3);display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);}
.msg-attach .att-head span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msg-attach .att-head a{color:var(--text-3);display:grid;transition:.2s var(--spring);}
.msg-attach .att-head a:hover{color:var(--text);transform:translateY(2px);}
.msg-attach img{display:block;max-width:100%;max-height:320px;width:100%;object-fit:cover;cursor:zoom-in;transition:transform .5s var(--out);}
.msg-attach:hover img{transform:scale(1.02);}
.msg-attach .imgwrap{overflow:hidden;}
.typing{height:22px;padding:0 24px;font-size:.75rem;color:var(--text-4);display:flex;align-items:center;gap:8px;}
.dots span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--text-3);margin:0 1px;animation:dot 1s infinite;}
.dots span:nth-child(2){animation-delay:.15s;}.dots span:nth-child(3){animation-delay:.3s;}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}
.drop{position:absolute;inset:10px;z-index:20;display:none;place-items:center;border:2px dashed var(--text-3);border-radius:22px;background:rgba(127,127,127,.16);backdrop-filter:blur(8px);}
.drop.show{display:grid;animation:fade .25s;}
.drop div{display:flex;flex-direction:column;align-items:center;gap:10px;font-weight:800;animation:floaty 2s ease-in-out infinite;}

/* composer */
.composer{padding:0 20px 16px;flex-shrink:0;position:relative;}
.reply-banner,.edit-banner{background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r) var(--r) 0 0;padding:8px 14px;display:none;align-items:center;gap:10px;font-size:.8rem;border-bottom:none;margin-bottom:-1px;}
.reply-banner.show,.edit-banner.show{display:flex;animation:bannerIn .35s var(--out);}
@keyframes bannerIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.reply-banner b,.edit-banner b{font-weight:800;}
.reply-banner .text,.edit-banner .text{flex:1;color:var(--text-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.banner-close{background:none;border:none;color:var(--text-4);cursor:pointer;padding:3px;border-radius:5px;display:grid;place-items:center;transition:.2s;}
.banner-close:hover{color:var(--text);background:var(--bg-5);}
.composer-box{display:flex;align-items:flex-end;gap:6px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:8px 10px;transition:.35s var(--out);}
.reply-banner.show~.composer-box,.edit-banner.show~.composer-box{border-top-right-radius:0;border-top-left-radius:0;}
.composer-box:focus-within{border-color:var(--text-4);background:var(--bg-4);transform:translateY(-1px);box-shadow:0 10px 30px rgba(0,0,0,.25);}
.composer-box textarea{flex:1;background:none;border:none;outline:none;resize:none;font-size:.92rem;line-height:1.5;max-height:140px;min-height:24px;padding:6px 4px;}
.composer-box textarea::placeholder{color:var(--text-4);}
.send-btn{background:var(--text);border:none;color:var(--inv);width:36px;height:36px;border-radius:11px;cursor:pointer;display:grid;place-items:center;transition:.35s var(--spring);flex-shrink:0;}
.send-btn:hover{transform:scale(1.1) rotate(-10deg);}
.send-btn:active{transform:scale(.88);}
.attach-preview{display:none;margin-bottom:10px;align-items:center;gap:12px;background:var(--bg-3);border:1px solid var(--line-2);border-radius:var(--r);padding:8px;width:fit-content;max-width:100%;}
.attach-preview.show{display:flex;animation:pop .5s var(--spring);}
.attach-preview img{height:64px;width:64px;object-fit:cover;border-radius:9px;}
.attach-preview b{font-size:.8rem;display:block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attach-preview small{font-size:.7rem;color:var(--text-4);}

/* members */
.members{width:0;overflow:hidden;background:var(--bg-2);border-inline-start:0 solid var(--line);transition:width .5s var(--out);flex-shrink:0;}
.members.show{width:240px;border-inline-start-width:1px;}
.members-in{width:240px;padding:16px 10px;overflow-y:auto;height:100%;}
.m-title{font-size:.68rem;font-weight:800;color:var(--text-4);padding:6px 8px;letter-spacing:.08em;}
.m-item{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;cursor:pointer;transition:.25s var(--out);animation:rise .5s var(--out) both;}
.m-item:hover{background:var(--bg-4);transform:translateX(-3px);}
.m-item b{font-size:.85rem;font-weight:800;display:block;line-height:1.2;}
.m-item small{font-size:.68rem;color:var(--text-4);display:block;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.m-item.off{opacity:.5;}
.m-av{position:relative;}
.m-av .st{background:var(--bg-2);width:14px;height:14px;}

/* ---------- TOAST / MENU / LIGHTBOX ---------- */
.toast-wrap{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:100000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:var(--text);color:var(--inv);padding:10px 18px;border-radius:12px;font-size:.84rem;font-weight:800;box-shadow:var(--shadow);animation:toastIn .5s var(--spring);}
.toast.out{opacity:0;transform:translateY(10px);transition:.3s;}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) scale(.9);}to{opacity:1;transform:none;}}
@keyframes fade{from{opacity:0;}}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100001;display:none;place-items:center;}
.lightbox.show{display:grid;animation:fade .3s;}
.lightbox img{max-width:90vw;max-height:86vh;border-radius:14px;animation:pop .55s var(--spring);}
.lb-bar{position:absolute;top:18px;left:18px;display:flex;gap:8px;}
.lb-bar .icon-btn,.lb-bar a{background:rgba(255,255,255,.12);color:#fff;border-radius:11px;padding:10px;display:grid;}
.lb-bar .icon-btn:hover,.lb-bar a:hover{background:rgba(255,255,255,.25);color:#fff;}
.pop-menu{position:fixed;background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;padding:6px;z-index:10000;display:none;box-shadow:var(--shadow);min-width:200px;}
.pop-menu.show{display:block;animation:menuIn .35s var(--spring);}
@keyframes menuIn{from{opacity:0;transform:scale(.92) translateY(8px);}to{opacity:1;transform:none;}}
.pop-menu .it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:.85rem;color:var(--text-2);transition:.18s;}
.pop-menu .it:hover{background:var(--bg-5);color:var(--text);}
.pop-menu .sep{height:1px;background:var(--line);margin:5px 4px;}

/* profile card */
.profile{position:fixed;width:310px;background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-xl);overflow:hidden;z-index:10001;display:none;box-shadow:var(--shadow);}
.profile.show{display:block;animation:menuIn .4s var(--spring);}
.pcard{background:var(--bg-2);border:1px solid var(--line-2);border-radius:var(--r-xl);overflow:hidden;}
.profile .pcard{border:none;border-radius:0;}
.banner{height:84px;background:var(--bg-4);position:relative;overflow:hidden;}
.banner img{width:100%;height:100%;object-fit:cover;display:block;}
.banner svg{position:absolute;inset:0;width:100%;height:100%;color:var(--text-4);opacity:.6;}
.pav-wrap{position:relative;width:76px;margin-top:-40px;margin-inline-start:18px;}
.pav-wrap .av{border:5px solid var(--bg-2);box-sizing:content-box;}
.pst{position:absolute;bottom:2px;left:-4px;background:var(--bg-2);border-radius:50%;padding:3px;color:var(--text);display:grid;}
.pbody{padding:10px 18px 18px;}
.pbody h3{font-size:1.15rem;font-weight:800;}
.pbody .tag{color:var(--text-4);font-size:.8rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.cstat{font-size:.82rem;color:var(--text-2);margin-bottom:10px;padding:6px 10px;background:var(--bg-4);border-radius:10px;width:fit-content;max-width:100%;}
.box{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:.8rem;color:var(--text-3);line-height:1.7;}
.box b{display:block;color:var(--text);font-size:.66rem;letter-spacing:.08em;margin-bottom:4px;}
.box+.box{margin-top:8px;}

/* ---------- OVERLAYS ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(8px);z-index:50000;display:none;place-items:center;}
.overlay.show{display:grid;animation:fade .25s;}
#dlg,#crop{z-index:60000;}
#qs{z-index:70000;place-items:start center;padding-top:14vh;}
.modal{width:min(960px,95vw);height:min(660px,90vh);background:var(--bg-1);border:1px solid var(--line-2);border-radius:var(--r-xl);display:flex;overflow:hidden;box-shadow:var(--shadow);animation:modalIn .55s var(--spring);position:relative;}
@keyframes modalIn{from{opacity:0;transform:scale(.92) translateY(24px);}to{opacity:1;transform:none;}}
.modal-nav{width:220px;background:var(--bg-2);border-inline-end:1px solid var(--line);padding:22px 12px;display:flex;flex-direction:column;gap:2px;flex-shrink:0;overflow-y:auto;}
.modal-nav h4{font-size:.66rem;color:var(--text-4);font-weight:800;letter-spacing:.08em;padding:12px 10px 6px;}
.modal-nav h4:first-child{padding-top:0;}
.nav-it{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;color:var(--text-3);font-size:.88rem;font-weight:700;transition:.3s var(--out);}
.nav-it:hover{background:var(--bg-4);color:var(--text);transform:translateX(-3px);}
.nav-it.active{background:var(--text);color:var(--inv);}
.modal-main{flex:1;overflow-y:auto;padding:30px 34px 90px;}
.modal-main::-webkit-scrollbar{width:6px;}
.modal-main::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px;}
.pane{animation:paneIn .5s var(--out);}
@keyframes paneIn{from{opacity:0;transform:translateX(-16px);}to{opacity:1;transform:none;}}
.pane h3{font-size:1.35rem;font-weight:800;margin-bottom:22px;}
.modal-close{position:absolute;top:16px;left:16px;z-index:3;border:1px solid var(--line-2);}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;}
.card h5{font-size:.68rem;color:var(--text-4);letter-spacing:.08em;margin-bottom:12px;font-weight:800;}
.card.danger{border-style:dashed;}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:none;}
.row:first-child{padding-top:0;}
.row b{font-size:.88rem;display:block;font-weight:800;}
.row small{font-size:.75rem;color:var(--text-4);}
.inp{width:100%;background:var(--bg-3);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:.9rem;outline:none;transition:.3s var(--out);resize:none;}
.inp:focus{border-color:var(--text-3);background:var(--bg-4);}
textarea.inp{min-height:78px;line-height:1.6;}
.pfx{display:flex;align-items:center;background:var(--bg-3);border:1px solid var(--line-2);border-radius:10px;transition:.3s var(--out);}
.pfx:focus-within{border-color:var(--text-3);background:var(--bg-4);}
.pfx span{padding:0 4px 0 0;color:var(--text-4);padding-inline-start:12px;font-weight:800;}
.pfx .inp{border:none;background:none;padding-inline-start:4px;}
.err{color:var(--text);font-size:.72rem;display:block;min-height:16px;margin-top:4px;font-weight:700;}
.fld{margin-bottom:14px;}
.fld>label{display:flex;justify-content:space-between;font-size:.74rem;color:var(--text-3);font-weight:800;margin-bottom:6px;}
.fld>label span{color:var(--text-4);font-weight:500;}
.inline{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-3);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 14px;font-size:.88rem;}
.btn{background:var(--text);color:var(--inv);border:none;padding:9px 18px;border-radius:10px;font-weight:800;font-size:.85rem;cursor:pointer;transition:.35s var(--spring);white-space:nowrap;display:inline-flex;align-items:center;gap:8px;}
.btn:hover{transform:translateY(-2px);}
.btn:active{transform:scale(.95);}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line-2);}
.btn.ghost:hover{background:var(--bg-4);}
.btn.sm{padding:6px 12px;font-size:.78rem;}
.btns{display:flex;gap:8px;flex-wrap:wrap;}
.tg{width:44px;height:25px;border-radius:25px;background:var(--bg-5);position:relative;cursor:pointer;transition:background .35s var(--out);flex-shrink:0;}
.tg::after{content:'';position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:var(--text-3);transition:all .4s var(--spring);}
.tg.on{background:var(--text);}
.tg.on::after{right:22px;background:var(--inv);}
.seg{display:inline-flex;background:var(--bg-3);border:1px solid var(--line-2);border-radius:11px;padding:3px;gap:2px;}
.seg button{background:none;border:none;padding:6px 14px;border-radius:8px;font-size:.78rem;font-weight:800;color:var(--text-3);cursor:pointer;transition:.3s var(--out);}
.seg button:hover{color:var(--text);}
.seg button.active{background:var(--text);color:var(--inv);}
input[type=range]{-webkit-appearance:none;appearance:none;width:180px;height:4px;border-radius:4px;background:var(--bg-5);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--text);cursor:pointer;transition:transform .25s var(--spring);}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.35);}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;background:var(--text);cursor:pointer;}
.rv{font-size:.75rem;color:var(--text-4);min-width:38px;text-align:left;}
.rwrap{display:flex;align-items:center;gap:12px;}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.theme-card{border:2px solid var(--line-2);border-radius:14px;padding:10px;cursor:pointer;transition:.4s var(--out);}
.theme-card:hover{transform:translateY(-3px);}
.theme-card.active{border-color:var(--text);}
.theme-card .pv{height:78px;border-radius:9px;display:flex;overflow:hidden;margin-bottom:8px;border:1px solid var(--line-2);}
.theme-card .pv i{display:block;}
.theme-card span{font-size:.82rem;font-weight:800;}
.statuses{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stbtn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border:1px solid var(--line-2);border-radius:12px;cursor:pointer;font-size:.78rem;font-weight:800;color:var(--text-3);transition:.35s var(--out);}
.stbtn:hover{transform:translateY(-2px);color:var(--text);}
.stbtn.active{background:var(--text);color:var(--inv);border-color:var(--text);}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{width:64px;height:40px;border-radius:10px;border:2px solid var(--line-2);background:var(--bg-4);overflow:hidden;cursor:pointer;color:var(--text-3);transition:.35s var(--out);position:relative;}
.chip svg{width:100%;height:100%;}
.chip:hover{transform:translateY(-2px);}
.chip.active{border-color:var(--text);}
.prof-grid{display:grid;grid-template-columns:1fr 310px;gap:22px;align-items:start;}
.prof-grid .sticky{position:sticky;top:0;}
.prof-grid .sticky h5{font-size:.68rem;color:var(--text-4);letter-spacing:.08em;margin-bottom:10px;font-weight:800;}
.acc-card{background:var(--bg-2);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;}
.acc-card .banner{height:92px;}
.acc-top{display:flex;align-items:center;gap:16px;padding:0 20px;margin-top:-34px;}
.acc-av{position:relative;}
.acc-av .av{border:5px solid var(--bg-2);box-sizing:content-box;}
.acc-av .pst{bottom:4px;}
.acc-id{flex:1;padding-top:36px;min-width:0;}
.acc-id b{font-size:1.1rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acc-id small{color:var(--text-4);}
.acc-top .btn{margin-top:36px;}
.acc-fields{padding:18px 20px 8px;}
.meter{display:flex;align-items:flex-end;gap:3px;height:34px;}
.meter i{flex:1;background:var(--text);border-radius:2px;transform-origin:bottom;animation:eq 1s ease-in-out infinite;height:100%;}
.meter.paused i{animation-play-state:paused;transform:scaleY(.12);opacity:.3;}
.keys .kr{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:.88rem;font-weight:700;}
.keys .kr:last-child{border:none;}
.keys kbd{font-family:'Space Grotesk',sans-serif;font-size:.72rem;background:var(--bg-4);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;padding:2px 8px;margin-inline-start:4px;}
.about{text-align:center;padding:30px 0;}
.about .lg{width:96px;height:96px;margin:0 auto 18px;animation:floaty 4.5s ease-in-out infinite;}
.about p{color:var(--text-4);font-size:.85rem;margin-top:6px;}
.savebar{position:absolute;bottom:16px;left:24px;right:244px;background:var(--text);color:var(--inv);border-radius:14px;padding:11px 16px;display:flex;align-items:center;gap:12px;font-size:.85rem;font-weight:800;box-shadow:var(--shadow);transform:translateY(140%);opacity:0;pointer-events:none;transition:.55s var(--spring);z-index:4;}
.savebar.show{transform:none;opacity:1;pointer-events:auto;}
.savebar.shake{animation:shake .5s;}
@keyframes shake{0%,100%{transform:none;}20%{transform:translateX(-9px);}40%{transform:translateX(9px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
.savebar span{flex:1;}
.savebar .btn{background:var(--inv);color:var(--text);}
.savebar .btn.ghost{background:transparent;color:var(--inv);border-color:rgba(127,127,127,.5);}

/* dialogs / cropper / quick switcher */
.dlg{width:min(400px,92vw);background:var(--bg-2);border:1px solid var(--line-2);border-radius:20px;padding:24px;box-shadow:var(--shadow);animation:modalIn .5s var(--spring);}
.dlg h3{font-size:1.1rem;font-weight:800;margin-bottom:6px;}
.dlg p{color:var(--text-3);font-size:.85rem;line-height:1.7;margin-bottom:14px;}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.crop-box{width:min(440px,94vw);}
.crop-stage{display:grid;place-items:center;background:var(--bg-0);border-radius:14px;padding:10px;margin-top:12px;}
.crop-stage canvas{max-width:100%;border-radius:8px;cursor:grab;touch-action:none;}
.crop-stage canvas:active{cursor:grabbing;}
.zoom{display:flex;align-items:center;gap:12px;margin-top:14px;color:var(--text-3);}
.zoom input{flex:1;width:auto;}
.hint{font-size:.74rem;color:var(--text-4);text-align:center;margin:10px 0 0;}
.qs-box{width:min(540px,94vw);background:var(--bg-2);border:1px solid var(--line-2);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);animation:modalIn .45s var(--spring);}

/* ===== v8: Discord-style call + voice stage, Claude-style mic ===== */
.callbar.show{flex-direction:column;align-items:center;gap:14px;padding:22px 16px 18px;background:radial-gradient(120% 140% at 50% 0,color-mix(in srgb,var(--c-ok) 10%,var(--bg-1)),var(--bg-0));border-bottom:1px solid var(--line)}
.cs-tiles{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}

/* voice stage */

.vs-top{display:flex;align-items:center;gap:10px;font-weight:800}

.vs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.vs-t{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 8px 10px;background:var(--bg-3);border:1px solid var(--line);border-radius:14px;transition:box-shadow .12s,border-color .12s;cursor:context-menu}

.recbar{background:var(--bg-3);border:1px solid var(--line-2);border-radius:999px;padding:6px 8px;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.18)}

/* glow: works without color-mix + stronger */

@supports (color:color-mix(in srgb,red,blue)){body{--acc-glow:color-mix(in srgb,var(--text) 62%,transparent)}}
.srv:hover,.srv.active{box-shadow:0 0 22px var(--acc-glow)}

.callbar.show{background:radial-gradient(120% 140% at 50% 0,rgba(47,191,106,.14),var(--bg-0))}

/* ===== v2 polish ===== */
.ambient{contain:strict;}
.ambient::after{will-change:transform;}
body{overscroll-behavior:none;}
.messages,.ch-scroll,.rail,.members-in,.modal,.dlg{overscroll-behavior:contain;}
body.tabhid *,body.tabhid *::before,body.tabhid *::after{animation-play-state:paused!important;}
body.booted .ch,body.booted .srv{animation:none;}
.msg.nb{animation:none;}
.older{display:block;margin:14px auto 6px;}
.srv{transition:background .35s var(--out),color .35s var(--out),border-radius .45s var(--out),transform .35s var(--spring),border-color .35s,box-shadow .35s,opacity .3s;}
.btn:active,.icon-btn:active,.srv:active,.theme-card:active{transform:scale(.93);transition-duration:.08s;}
.icon-btn:hover{transform:translateY(-1px);}
.theme-card{transition:transform .35s var(--spring),border-color .25s;}
.theme-card:hover{transform:translateY(-3px);}
.tg{transition:background .3s var(--out),box-shadow .3s;}
.vs-t{transition:box-shadow .18s,border-color .18s,transform .3s var(--spring),opacity .3s;}
.vs-t.sp{transform:translateY(-2px);}
.vs-b{transition:transform .3s var(--spring),background .25s,color .25s,border-color .25s;}
.ci-av{position:relative;}
.ci-av::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c-ok,#2fbf6a);opacity:0;animation:ringOut 1.6s ease-out infinite;pointer-events:none;}
@keyframes ringOut{0%{transform:scale(.92);opacity:.7;}100%{transform:scale(1.45);opacity:0;}}
.toast{animation:toastIn .5s var(--spring);will-change:transform,opacity;}
.pop-menu .it{transition:background .18s,color .18s,transform .18s var(--out);}
.pop-menu .it:hover{transform:translateX(-2px);}
:focus-visible{outline:2px solid var(--text-2);outline-offset:3px;transition:outline-offset .15s;}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important;}
}
/* ===== bot scripts: chat cards + manager ===== */

.au-tabs i{position:absolute;top:3px;bottom:3px;width:calc(50% - 3px);inset-inline-start:3px;background:var(--text);border-radius:9px;transition:transform .45s var(--spring)}
.au-card[data-m=up] .au-tabs i{transform:translateX(-100%)}html[dir=ltr] .au-card[data-m=up] .au-tabs i{transform:translateX(100%)}
.au-tabs button{position:relative;z-index:1;background:none;border:0;padding:9px;font:inherit;font-weight:800;font-size:.86rem;color:var(--text-3);cursor:pointer;transition:color .3s}
.au-tabs button.on{color:var(--inv)}
.au-f{display:flex;flex-direction:column;gap:12px}
.au-f label{display:block;font-size:.78rem;font-weight:800;color:var(--text-3);margin-bottom:6px}
.au-f .inp{width:100%}
.au-up{display:none}.au-card[data-m=up] .au-up{display:block;animation:auIn .4s var(--out)}.au-card[data-m=up] .au-in{display:none}
@keyframes auIn{from{opacity:0;transform:translateY(-6px)}}
.au-pw{position:relative}.au-pw .inp{padding-inline-end:42px}
.au-pw button{position:absolute;inset-inline-end:6px;top:50%;translate:0 -50%;width:32px;height:32px;display:grid;place-items:center;background:none;border:0;border-radius:8px;color:var(--text-4);cursor:pointer}
.au-pw button:hover,.au-pw button.on{color:var(--text)}
.au-err{min-height:1.2em;font-size:.8rem;font-weight:700;color:var(--c-err)}
.au-go{width:100%;justify-content:center;padding:12px;font-size:.92rem}.au-go:disabled{opacity:.6;cursor:wait}#auth2 .au-go+.au-go{margin-top:8px}.modal-nav.srch .nav-pill{opacity:0}.modal-nav.srch .nav-it.active{color:var(--text-3)}
.au-sw{text-align:center;font-size:.82rem;color:var(--text-3);margin-top:14px}
.au-sw button{background:none;border:0;color:var(--text);font:inherit;font-weight:800;cursor:pointer;text-decoration:underline;padding:0 4px}
.au-note{text-align:center;font-size:.72rem;color:var(--text-4);margin-top:10px}
.au-langs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.au-langs button{background:none;border:1px solid var(--line-2);border-radius:8px;padding:4px 9px;font:inherit;font-size:.72rem;font-weight:800;color:var(--text-3);cursor:pointer}
.au-langs button.on{background:var(--text);color:var(--inv);border-color:var(--text)}
.au-card.shake{animation:shake .5s}
@media(prefers-reduced-motion:reduce){.au-card,.au-up{animation:none!important}.au-tabs i{transition:none}}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
/* ===== auth: local accounts (this browser only) ===== */
const AUTH=(()=>{
const AK='kavlod_accounts',SK='kavlod_session',LK='kavlod_v4';
/* storage shim: localStorage when usable; otherwise memory mirrored to window.name so sign-in survives the reload (sandboxed previews, phone file viewers, strict privacy modes) */
let persist=true;try{localStorage.setItem('__kv','1');localStorage.removeItem('__kv');}catch(e){persist=false;}
let mem={};if(!persist){try{const o=JSON.parse(window.name||'null');if(o&&o.ns==='kavlod_auth'&&o.d&&typeof o.d==='object')mem=o.d;}catch(e){}}
const flush=()=>{try{window.name=JSON.stringify({ns:'kavlod_auth',d:mem});return true;}catch(e){return false;}};

  set(k,v){if(persist){try{localStorage.setItem(k,v);return true;}catch(e){return false;}}mem[k]=String(v);return flush();},

const accts=()=>{const a=rd(AK);return Array.isArray(a)?a:[];},wr=a=>ST.set(AK,JSON.stringify(a));
const sid=()=>ST.get(SK);
const cur=()=>accts().find(a=>a.id===sid())||null;
const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const rnd=n=>{const u=new Uint8Array(n);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(u);else for(let i=0;i<n;i++)u[i]=Math.random()*256;return hex(u);};

const SH=(()=>{const K=new Uint32Array(64),IV=new Uint32Array(8),w=new Uint32Array(64);
  for(let n=2,i=0;i<64;n++){let p=1;for(let d=2;d*d<=n;d++)if(n%d===0){p=0;break;}if(p){if(i<8)IV[i]=Math.pow(n,.5)%1*4294967296;K[i++]=Math.pow(n,1/3)%1*4294967296;}}

    for(let i=0;i<64;i++){const t1=(h+(rr(e,6)^rr(e,11)^rr(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0,t2=((rr(a,2)^rr(a,13)^rr(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    s[0]+=a;s[1]+=b;s[2]+=c;s[3]+=d;s[4]+=e;s[5]+=f;s[6]+=g;s[7]+=h;}
  const ld=(k,o)=>{for(let i=0;i<16;i++)w[i]=(k[o+4*i]<<24)|(k[o+4*i+1]<<16)|(k[o+4*i+2]<<8)|k[o+4*i+3];};

    for(let o=0;o<L;o+=64){ld(b,o);cmp(s);}return s;}
  const wb=s=>{const o=new Uint8Array(32);for(let i=0;i<8;i++){o[4*i]=s[i]>>>24;o[4*i+1]=s[i]>>>16;o[4*i+2]=s[i]>>>8;o[4*i+3]=s[i];}return o;};

    const si=new Uint32Array(IV),so=new Uint32Array(IV);ld(ki,0);cmp(si);ld(ko,0);cmp(so);
    const m=new Uint8Array(S.length+4);m.set(S);m[m.length-1]=1;
    let u=fin(so,wb(fin(si,m,64)),64);const t=new Uint32Array(u),x=new Uint32Array(8),y=new Uint32Array(8);
    for(let n=1;n<c;n++){
      for(let i=0;i<8;i++)w[i]=u[i];w[8]=0x80000000;for(let i=9;i<15;i++)w[i]=0;w[15]=768;x.set(si);cmp(x);
      for(let i=0;i<8;i++)w[i]=x[i];w[8]=0x80000000;for(let i=9;i<15;i++)w[i]=0;w[15]=768;y.set(so);cmp(y);
      u=y;for(let i=0;i<8;i++)t[i]^=y[i];}
    return [...t].map(v=>v.toString(16).padStart(8,'0')).join('');}
  return {pbk};})();
async function H(pw,salt){
  try{if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:120000},k,256));}}catch(e){}

/* accounts made by the old weak fallback hash ('f'+hex) still verify, and are silently upgraded to PBKDF2 */
const weak=(pw,salt)=>{let h=5381;for(let r=0;r<20000;r++)for(const ch of salt+pw)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'f'+h.toString(16);};
async function ver(pw,a){
  if(/^f[0-9a-f]{1,8}$/.test(a.hash||'')){if(weak(pw,a.salt)!==a.hash)return false;
    try{const l=accts(),x=l.find(y=>y.id===a.id);if(x){x.hash=await H(pw,x.salt);wr(l);}}catch(e){}return true;}
  return (await H(pw,a.salt))===a.hash;}
let fails=0,lock=0;
/* ===== server mode: real accounts + cloud sync when served by server.js over http(s); otherwise the original local mode ===== */
const TK='kavlod_tok',origin=/^https?:$/.test(location.protocol)?location.origin:'';
let _srv;const srv=()=>_srv||(_srv=origin?fetch(origin+'/api/ping',{cache:'no-store'}).then(r=>r.ok&&r.json()).then(j=>!!(j&&j.ok)).catch(()=>false):Promise.resolve(false));
const tok=()=>ST.get(TK);
async function api(p,b,m){try{const r=await fetch(origin+'/api/'+p,{method:m||'POST',headers:{'Content-Type':'text/plain','Authorization':'Bearer '+(tok()||'')},body:b===undefined?undefined:(typeof b==='string'?b:JSON.stringify(b))});let j={};try{j=await r.json();}catch(e){}return {s:r.status,j};}catch(e){return {s:0,j:{}};}}
function adopt(j){const a=j.account,key='kavlod_v4_'+a.id,l=accts().filter(x=>x.id!==a.id);
  l.push({id:a.id,name:a.name,tag:a.tag,email:a.email,salt:'',hash:'srv',key,fresh:!j.state,ts:Date.now()});
  if(j.state)ST.set(key,j.state);ST.set('kavlod_v_'+a.id,String(j.v||0));
  if(!wr(l)||!ST.set(SK,a.id)||!ST.set(TK,j.token))return ERR_ST;location.reload();}
const NOSRV='تعذّر الاتصال بالخادم';
const ERR_ST='تعذّر الحفظ. تحقق من مساحة التخزين في المتصفح';
const clean=s=>s.normalize('NFKC').replace(/[\u200B-\u200F\u202A-\u202E\u2060-\u2069\uFEFF]/g,'').replace(/[\u0660-\u0669\u06F0-\u06F9]/g,d=>String.fromCharCode(48+(d.charCodeAt(0)&15))).trim();
async function signup(name,tag,email,pw,pw2){
  if(!name)return 'اكتب اسماً معروضاً';
  if(!/^[a-z0-9._]{3,20}$/.test(tag))return 'اسم المستخدم 3-20 حرفاً: a-z و 0-9 . _';
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email))return 'البريد الإلكتروني غير صالح';
  if(pw.length<6)return 'كلمة المرور 6 أحرف على الأقل';
  if(pw!==pw2)return 'كلمتا المرور غير متطابقتين';
  if(await srv()){const r=await api('signup',{name,tag,email,password:pw});return r.s===200?adopt(r.j):(r.j.e||NOSRV);}
  const taken=l=>l.some(a=>a.email===email)?'البريد الإلكتروني مستخدم':l.some(a=>a.tag===tag)?'اسم المستخدم مستخدم':'';
  let t=taken(accts());if(t)return t;
  const id=rnd(8),salt=rnd(16),hash=await H(pw,salt);
  const l=accts();t=taken(l);if(t)return t; /* re-read after the await: another tab may have signed up meanwhile */
  let legacy=false;try{legacy=!l.length&&!!ST.get(LK);}catch(e){}
  l.push({id,name,tag,email,salt,hash,key:legacy?LK:'kavlod_v4_'+id,fresh:true,ts:Date.now()});
  if(!wr(l)||!ST.set(SK,id))return ERR_ST;
  location.reload();}
async function login(v,pw){
  if(Date.now()<lock)return 'حاول مجدداً بعد قليل';
  if(await srv()){const r=await api('login',{id:v,password:pw});
    if(r.s===200){fails=0;return adopt(r.j);}
    if(r.s===0)return NOSRV;
    if(r.s===401){const o=accts().find(x=>(x.email===v||x.tag===v)&&x.hash!=='srv');
      if(o&&await ver(pw,o)){const m=await api('signup',{name:o.name,tag:o.tag,email:o.email,password:pw,state:ST.get(o.key)||undefined});if(m.s===200){fails=0;return adopt(m.j);}return m.j.e||NOSRV;}}
    if(++fails>=3)lock=Date.now()+Math.min(30000,1000*2**(fails-2));
    return r.s===429?(r.j.e||'حاول مجدداً بعد قليل'):'بيانات الدخول غير صحيحة';}
  const a=accts().find(x=>x.email===v||x.tag===v);
  if(!(a&&await ver(pw,a))){if(++fails>=3)lock=Date.now()+Math.min(30000,1000*2**(fails-2));return 'بيانات الدخول غير صحيحة';}
  fails=0;if(!ST.set(SK,a.id))return ERR_ST;location.reload();}

  if(typeof v!=='string'||v.length<30000||!(k==='src'||k==='aud'||k==='img')||v.slice(0,5)!=='data:'||!MDB.db)return v;
  let id=MDB.map.get(v);
  if(!id){id='m'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);MDB.map.set(v,id);}
  if(MDB.done.has(id))return 'idb:'+id;
  if(!MDB.pend.has(id)){MDB.pend.add(id);mdbPut(id,v).then(ok=>{MDB.pend.delete(id);if(ok===true){MDB.done.add(id);save();}});}
  return v;
}
async function hydrate(){
  if(!(await mdbOpen()))return;
  const T=[];
  Object.values(S.msgs||{}).forEach(l=>(l||[]).forEach(m=>{
    if(typeof m.img==='string'&&m.img.startsWith('idb:'))T.push([m,'img']);
    if(typeof m.aud==='string'&&m.aud.startsWith('idb:'))T.push([m,'aud']);
    (m.imgs||[]).concat(m.files||[]).forEach(a=>{if(typeof a.src==='string'&&a.src.startsWith('idb:'))T.push([a,'src']);});}));
  const used=new Set();
  for(const [o,k] of T){const id=o[k].slice(4);used.add(id);const v=await mdbGet(id);
    if(typeof v==='string'){o[k]=v;MDB.map.set(v,id);MDB.done.add(id);}}
  if(T.some(([o,k])=>String(o[k]).startsWith('idb:'))){
    Object.values(S.msgs).forEach(l=>l.forEach(m=>{const gone=a=>typeof a.src==='string'&&a.src.startsWith('idb:');
      if(m.imgs)m.imgs=m.imgs.filter(a=>!gone(a));if(m.files)m.files=m.files.filter(a=>!gone(a));
      if(String(m.img).startsWith('idb:'))delete m.img;if(String(m.aud).startsWith('idb:'))delete m.aud;
      if(!m.text&&!(m.imgs&&m.imgs.length)&&!m.img&&!(m.files&&m.files.length)&&!m.aud&&!m.sys)m.text='📎 (مرفق مفقود)';}));
  }
  const keys=await mdbKeys();
  if(Array.isArray(keys))for(const id of keys)if(!used.has(id))await mdbDel(id);
}

function openCropper(file,o,cb){
  loadImage(file,im=>{
    const ov=$('#crop');
    ov.innerHTML=`<div class="dlg crop-box"><h3>${o.title}</h3><div class="crop-stage"><canvas id="cv" width="${o.cw}" height="${o.ch}"></canvas></div><div class="zoom">${IC.image(16)}<input type="range" id="cz" min="100" max="400" value="100">${IC.image(24)}</div><p class="hint">اسحب لتحريك الصورة · استخدم المنزلق للتكبير</p><div class="dlg-actions"><button class="btn ghost" id="cNo">إلغاء</button><button class="btn" id="cOk">تطبيق</button></div></div>`;
    ov.classList.add('show');

    const base=Math.max(o.cw/im.width,o.ch/im.height);let z=1,ox=0,oy=0;
    const sc=()=>base*z;
    const clamp=()=>{ox=Math.min(0,Math.max(o.cw-im.width*sc(),ox));oy=Math.min(0,Math.max(o.ch-im.height*sc(),oy));};
    ox=(o.cw-im.width*sc())/2;oy=(o.ch-im.height*sc())/2;

    cv.onpointermove=e=>{if(!drag)return;const k=cv.width/cv.getBoundingClientRect().width;ox+=(e.clientX-lx)*k;oy+=(e.clientY-ly)*k;lx=e.clientX;ly=e.clientY;clamp();draw();};

    cv.onwheel=e=>{e.preventDefault();const s=$('#cz');s.value=Math.min(400,Math.max(100,+s.value-e.deltaY*.2));setZ(+s.value);};

    };

function autoScan(sv,k,text){const m=M(sv),A=m.auto,t=text||'';

  if(A.spam){const n=Date.now(),a=SPAM[k]=(SPAM[k]||[]).filter(x=>n-x.t<6000);a.push({t:n,x:t});if(a.length>=5)return {why:'سبام',hard:1};if(a.filter(x=>x.x===t).length>=3)return {why:'تكرار الرسائل',hard:1};}

    if(attach.reduce((t,a)=>t+a.size,0)>3.5e6)return toast('حجم الصور كبير، أرسل بعضها أولاً');

    const add=(src,name)=>{attach.push({src,name,size:Math.round(src.length*.75)});renderAttach();$('#input').focus();};
    if(/gif|svg/.test(f.type||f.name)){
      if(f.size>4*1024*1024)return toast('GIF/SVG حتى 4MB');
      const r=new FileReader();r.onload=()=>add(r.result,f.name||'image');r.readAsDataURL(f);return;

    S.servers.forEach(s=>allChans(s).filter(c=>c.type==='text'&&(!q||(c.name+' '+s.name).toLowerCase().includes(q))).forEach(c=>items.push({s,c})));
    sel=Math.min(sel,Math.max(0,items.length-1));
    $('#qsList').innerHTML=items.length?items.map((x,i)=>`<div class="qs-it ${i===sel?'active':''}" data-i="${i}">${IC.hash(16)}<b>${esc(x.c.name)}</b><small>${esc(x.s.name)}</small></div>`).join(''):'<div class="qs-empty">لا توجد نتائج</div>';

  inp.oninput=()=>{sel=0;render();};

    const draw=()=>{H.textContent=s.name;

        <label class="ss-l">اسم السيرفر</label><input class="ss-in" id="ssN" maxlength="24" value="${esc(s.name)}">

      if(tab==='a'){B.innerHTML=prev()+`<div class="af-card"><div class="n"><b>غلاف السيرفر</b><small>صورة عريضة تظهر في أعلى القائمة الجانبية</small></div><div class="af-act"><button class="af-b" data-a="ban" type="button">رفع غلاف</button>${s.banner?'<button class="af-b" data-a="nobn" type="button">إزالة</button>':''}</div></div>
        <div class="af-card" style="flex-direction:column;align-items:stretch"><div><b>لون التوهج</b><br><small style="color:var(--text-3)">يظهر حول زر السيرفر. الافتراضي يؤخذ من الصورة</small></div><div class="ss-sw">${PAL.map(c=>`<button type="button" data-col="${c}" class="${(s.accent||'').toLowerCase()===c?'on':''}" style="background:${c}"></button>`).join('')}<input type="color" id="ssCol" value="${s.accent||'#ffffff'}"><button class="af-b" data-a="rcol" type="button">تلقائي</button></div></div>`;return;}

    draw();
    el.onchange=e=>{const t=e.target,ch=id=>allChans(s).find(c=>c.id===id);

      else if(t.dataset.ct){const c=ch(t.dataset.ct);if(c){c.topic=t.value.trim();sync(S.ch===c.id);}}
      else if(t.dataset.rl){s.roles=s.roles||{};if(t.value==='member')delete s.roles[t.dataset.rl];else s.roles[t.dataset.rl]=t.value;save();renderMembers();toast('تم تحديث الرتبة');}
      else if(t.id==='ssCol'){s.accent=t.value;sync();draw();}
      else if(t.dataset.ci!==undefined){const c=s.cats[+t.dataset.ci],v=t.value.trim();if(c&&v){c.name=v;sync();}else if(c)t.value=c.name;}};
    el.onclick=e=>{if(e.target.closest('#ssX'))return closeDlg();
      const cl=e.target.closest('[data-col]');if(cl){s.accent=cl.dataset.col;sync();return draw();}
      const tb=e.target.closest('[data-t]');if(tb){if(tb.dataset.t==='b')return window.xBotCfg?window.xBotCfg():toast('غير متاح');tab=tb.dataset.t;return draw();}
      const ty=e.target.closest('[data-ty]');if(ty){ct=ty.dataset.ty;return draw();}
      const a=e.target.closest('[data-a]');if(!a)return;const k=a.dataset.a;
      if(k==='ico')return window.xSrvIcon(s,()=>window.xSrvSettings('g'));
      if(k==='ban')return pickImage(f=>openCropper(f,{title:'غلاف السيرفر',cw:600,ch:200,ow:900,oh:300,round:false},d=>{s.banner=d;sync();window.xSrvSettings('a');}));
      if(k==='nobn'){delete s.banner;sync();return draw();}
      if(k==='rcol'){delete s.accent;sync();return draw();}
      if(k==='up'||k==='dn'){const g=s.cats.find(x=>x.channels.some(c=>c.id===a.dataset.id));if(!g)return;const i=g.channels.findIndex(c=>c.id===a.dataset.id),j=k==='up'?i-1:i+1;if(j<0||j>=g.channels.length)return;[g.channels[i],g.channels[j]]=[g.channels[j],g.channels[i]];sync();return draw();}
      if(k==='noico'){delete s.icon;sync();return draw();}
      if(k==='sg'){const n=el.querySelector('#ssN').value.trim();if(!n)return toast('اكتب اسماً للسيرفر');s.name=n;s.letter=n[0].toUpperCase();s.desc=el.querySelector('#ssD').value.trim();sync();toast('تم الحفظ');return draw();}
      if(k==='addch'){const n=el.querySelector('#ssNew').value.trim(),c=s.cats[+el.querySelector('#ssCat').value];if(!n||!c)return toast('اكتب اسم القناة');

      if(k==='addcat'){const n=el.querySelector('#ssNC').value.trim();if(!n)return toast('اكتب اسم الفئة');s.cats.push({name:n,channels:[]});sync();return draw();}
      if(k==='dch'){const c=allChans(s).find(x=>x.id===a.dataset.id);if(!c)return;if(isT(c)&&allChans(s).filter(isT).length<2)return toast('يجب أن يبقى قناة نصية واحدة على الأقل');
        return confirmD({title:'حذف '+esc(c.name)+'؟',text:'سيتم حذف القناة ورسائلها نهائياً.',ok:'حذف'},()=>{s.cats.forEach(g=>{g.channels=g.channels.filter(x=>x.id!==c.id);});gone(c.id);sync(true);window.xSrvSettings('c');});}
      if(k==='dcat'){const g=s.cats[+a.dataset.ci];if(!g)return;if(allChans(s).filter(isT).length-g.channels.filter(isT).length<1)return toast('يجب أن يبقى قناة نصية واحدة على الأقل');
        return confirmD({title:'حذف الفئة '+esc(g.name)+'؟',text:'ستُحذف كل قنواتها ورسائلها.',ok:'حذف'},()=>{g.channels.forEach(c=>gone(c.id));s.cats=s.cats.filter(x=>x!==g);sync(true);window.xSrvSettings('c');});}
      if(k==='dsrv')return confirmD({title:'حذف '+esc(s.name)+'؟',text:'سيتم حذف السيرفر وكل رسائله نهائياً.',ok:'حذف'},()=>{allChans(s).forEach(c=>{if(S.voice===c.id)S.voice=null;delete S.msgs[c.id];});S.servers=S.servers.filter(x=>x.id!==s.id);S.srv='home';S.ch='welcome';save();renderAll();toast('تم حذف السيرفر');});};
  });
};

function statusMenu(e){

function bind(){

  $('#chSearch').addEventListener('input',e=>{query=e.target.value;renderSidebar();});

  $('#camIn').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)handleAttach(fs);};
  $('#btnRec').onclick=toggleRec;
  {const rb=document.createElement('div');rb.className='recbar';rb.id='recBar';rb.innerHTML='<button class="rb-x" id="recX" type="button" title="إلغاء">'+IC.x(18)+'</button><button class="rb-x" id="recP" type="button" title="إيقاف مؤقت"></button><span class="rb-dot"></span><b class="rb-t" id="recT">0:00</b><div class="rb-wv" id="recW">'+'<i></i>'.repeat(32)+'</div><button class="rb-s" id="recS" type="button" title="إرسال">'+IC.check(18)+'</button>';
  $('.composer-box').after(rb);$('#recX').onclick=()=>recStop('cancel');$('#recS').onclick=()=>recStop('send');}

  document.addEventListener('pointerdown',()=>{ux=true;setTimeout(syncMic,0);},{once:true,capture:true});

  const chat=$('#chatMain');let dc=0;

  chat.addEventListener('dragenter',e=>{if(!hasFiles(e))return;dc++;$('#drop').classList.add('show');});
  chat.addEventListener('dragleave',()=>{dc=Math.max(0,dc-1);if(!dc)$('#drop').classList.remove('show');});
  chat.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault();});
  chat.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dc=0;$('#drop').classList.remove('show');if(e.dataTransfer.files.length)handleAttach(e.dataTransfer.files);});

  const box=$('#messages');

    else if(a==='copy'){const m=msgsOf(S.ch).find(x=>x.id===id);if(m&&navigator.clipboard)navigator.clipboard.writeText(m.text).then(()=>toast('تم النسخ'),()=>toast('تعذر النسخ'));}

    if($('#lightbox').classList.contains('show')&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){stepLB(e.key==='ArrowLeft'?1:-1);return;}
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#qs').classList.contains('show')?closeQS():openQS();return;}
    if((e.ctrlKey||e.metaKey)&&e.key===','){e.preventDefault();openSettings('account');return;}
    if(e.key==='Escape'){
      if($('#crop').classList.contains('show')){$('#crop').classList.remove('show');$('#crop').innerHTML='';}

      else if($('#qs').classList.contains('show'))closeQS();

      else if($('#menu').classList.contains('show')||$('#profile').classList.contains('show'))closePops();
      else closeSettings();
    }
  });
  $('#chSearch').addEventListener('focus',e=>{e.target.blur();openQS();});

const BG=['light','dark','green','red','blue','yellow','none'],MK=['sel','hint','last','check'],TC=['w','b','r','g','y'],BST=['primary','success','danger','secondary'];
function cleanCard(c){
  if(!c||typeof c!=='object')return null;

  if(c.footer)o.footer=str(c.footer,200);

  if(Array.isArray(c.fields))o.fields=c.fields.slice(0,12).map(f=>{f=(f&&typeof f==='object')?f:{};return {name:str(f.name,40),value:str(f.value,200),inline:!!f.inline};}).filter(f=>f.name||f.value);
  if(c.progress&&typeof c.progress==='object'){const mx=+c.progress.max||1;o.progress={v:Math.max(0,Math.min(1,(+c.progress.value||0)/mx)),label:str(c.progress.label,40)};}
  if(c.grid&&typeof c.grid==='object'&&Array.isArray(c.grid.cells)){
    const cols=Math.max(1,Math.min(16,parseInt(c.grid.cols)||1));
    o.grid={cols,cells:c.grid.cells.slice(0,256).map(x=>{
      x=(x&&typeof x==='object')?x:{t:x};
      const y={t:str(x.t,6)};
      if(BG.includes(x.bg))y.bg=x.bg;if(MK.includes(x.mk))y.mk=x.mk;if(TC.includes(x.tc))y.tc=x.tc;
      if(x.id!=null&&x.id!=='')y.id=str(x.id,24);if(x.off)y.off=1;return y;})};
  }
  if(Array.isArray(c.buttons))o.buttons=c.buttons.slice(0,12).map(b=>{
    b=(b&&typeof b==='object')?b:{label:b};
    return {label:str(b.label,24),id:str(b.id!=null?b.id:b.label,24),off:b.off?1:0,st:BST.includes(b.style)?b.style:''};}).filter(b=>b.label);
  if(okImg(c.image,200000))o.image=c.image;
  return o;
}
function cardHTML(raw){
  const c=cleanCard(raw);if(!c)return '';

/* ---------- messages from the sandbox (always untrusted) ---------- */
function onSandbox(run,d){
  switch(d.k){
    case 'ping':run.ping=Date.now();break;
    case 'ready':run.ready=true;run.ping=Date.now();addLog(run.id,'info','يعمل ✓');UIdots();refreshBotViews();break;
    case 'log':addLog(run.id,['log','info','warn','error'].includes(d.l)?d.l:'log',str(d.t,300));break;
    case 'err':{
      let t=str(d.m,300);const ln=(+d.l||0)-run.off+1;if(ln>=1&&ln<=run.lines+1)t+=' (سطر '+ln+')';
      if(!run.ready)return failBot(run,t);
      addLog(run.id,'error',t);break;}
    case 'cmd':{
      const n=str(d.name,20).toLowerCase();
      if(!/^[\p{L}\p{N}_-]{1,20}$/u.test(n))return addLog(run.id,'warn','اسم أمر غير صالح: '+n);
      if(!(n in run.cmds)&&Object.keys(run.cmds).length>=25)return addLog(run.id,'warn','الحد الأقصى 25 أمراً');
      const role=['member','mod','admin','owner'].includes(d.role)?d.role:'member';
      const cd=d.cd==null?null:Math.max(0,Math.min(3600,+d.cd||0));
      const slash=!CM[n];if(!slash&&!(n in run.cmds))addLog(run.id,'info','/'+n+' محجوز لأمر مدمج — يعمل بالبادئة فقط: '+((botOf(run)||{set:{prefix:'!'}}).set.prefix)+n);
      run.cmds[n]={d:str(d.desc,80),role,cd,slash};UIdots();break;}
    case 'store':{
      const s=str(d.s,MAXSTORE+1);if(s.length>MAXSTORE)return addLog(run.id,'warn','حجم التخزين تجاوز 30 ألف حرف — لم يُحفظ');
      let v;try{v=JSON.parse(s);}catch(e){return;}
      if(!v||typeof v!=='object'||Array.isArray(v))return;
      const b=botOf(run);if(b){b.store=v;save();}break;}
    case 'say':case 'card':{
      const sv=svOf(run),b=botOf(run);if(!sv||!b||!botOn(sv))return;
      if(!b.perms.send)return addLog(run.id,'warn','لا يملك البوت صلاحية «إرسال الرسائل»');
      const c=chRes(run,d.ch);if(!c)return addLog(run.id,'warn','قناة غير موجودة في هذا السيرفر');
      if(!chOK(run,c))return addLog(run.id,'warn','القناة #'+c.name+' غير مسموحة لهذا البوت');
      if(d.k==='say'){const t=str(d.text,2000).trim();if(!t)return;if(!rl(run,'rate',b.set.rate))return;putMsg(run,c,{text:t});}
      else{const card=cleanCard(d.card),cid=str(d.id,40);if(!card||!cid)return;if(!rl(run,'rate',b.set.rate))return;putMsg(run,c,{card,cid});}
      break;}
    case 'upd':{
      const sv=svOf(run);if(!sv||!botOn(sv))return;
      const f=findCard(run,str(d.id,40)),card=cleanCard(d.card);if(!f||!card)return;
      if(!rl(run,'rate2',80))return;
      f.m.card=card;save();
      if(f.c.id===S.ch&&S.srv===run.sid){const n=swapMsg(f.m.id);if(!n)renderChat();}
      break;}
    case 'rm':{
      const f=findCard(run,str(d.id,40));if(!f)return;
      f.l.splice(f.l.indexOf(f.m),1);save();if(f.c.id===S.ch&&S.srv===run.sid)renderChat();break;}
    case 'act':{
      const rid=+d.rid||0;let out;
      try{out=doAct(run,str(d.a,30),d.args);}
      catch(e){return toRun(run,{k:'res',rid,ok:false,err:String(e&&e.message||e).slice(0,200)});}
      Promise.resolve(out).then(v=>toRun(run,{k:'res',rid,ok:true,v:v===undefined?null:v}),e=>toRun(run,{k:'res',rid,ok:false,err:String(e&&e.message||e).slice(0,200)}));break;}
  }
}
